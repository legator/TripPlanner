name: Mobile Store Release (Google Play & TestFlight)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Target platform to release'
        required: true
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'android'
          - 'ios'
      track:
        description: 'Google Play track (Android only)'
        required: true
        default: 'internal'
        type: choice
        options:
          - 'internal'
          - 'alpha'
          - 'beta'
          - 'production'
      server_url:
        description: 'Target WebView Server URL (e.g. https://my-app.vercel.app)'
        required: false
        default: ''
        type: string
      tag_name:
        description: 'Git tag for GitHub Release (e.g. v1.0.0, optional for manual run)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*.*.*'

jobs:
  # --------------------------------------------------------------------------
  # Android: Build Signed .aab & Publish to Google Play Internal Testing
  # --------------------------------------------------------------------------
  release-android:
    name: Release Android (Play Store & APK)
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Android Release Credentials
        id: check_android_secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 is not configured. Binaries will remain unsigned."
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$SERVICE_ACCOUNT_JSON" ]; then
            echo "has_play_account=true" >> $GITHUB_OUTPUT
          else
            echo "::warning::Google Play upload skipped: Required secrets (ANDROID_KEYSTORE_BASE64, GOOGLE_PLAY_SERVICE_ACCOUNT_JSON) are not configured."
            echo "has_play_account=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || 'AIzaSyDemoKeyForCiBuildPurposesOnly12345' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSyDemoKeyForCiBuildPurposesOnly12345' }}
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || secrets.CAPACITOR_SERVER_URL || '' }}

      - name: Sync Capacitor Android
        run: npx cap sync android
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || secrets.CAPACITOR_SERVER_URL || '' }}

      - name: Grant execute permission for gradlew
        run: chmod +x android/gradlew

      - name: Build Android Release Binaries (.apk & .aab)
        run: |
          cd android
          ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Sign Android Release Bundle (.aab)
        if: steps.check_android_secrets.outputs.has_keystore == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_bundle
        with:
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Sign Android Release APK (.apk)
        if: steps.check_android_secrets.outputs.has_keystore == 'true'
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload to Google Play
        if: steps.check_android_secrets.outputs.has_play_account == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.arleons.tripplanner.app
          releaseFiles: ${{ steps.sign_bundle.outputs.signedReleaseFile || 'android/app/build/outputs/bundle/release/*.aab' }}
          track: ${{ github.event.inputs.track || 'internal' }}
          status: completed

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trip-planner-android-release
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
          retention-days: 30

  # --------------------------------------------------------------------------
  # iOS: Build Signed .ipa & Publish to Apple TestFlight
  # --------------------------------------------------------------------------
  release-ios:
    name: Release to Apple TestFlight
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify iOS Release Credentials
        id: check_ios_secrets
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          CERT_P12: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$API_KEY_ID" ] || [ -z "$API_ISSUER_ID" ] || [ -z "$API_KEY_P8" ] || [ -z "$CERT_P12" ] || [ -z "$PROFILE" ]; then
            echo "::warning::TestFlight upload skipped: Required secrets (APP_STORE_CONNECT_API_KEY_ID, APP_STORE_CONNECT_API_ISSUER_ID, APP_STORE_CONNECT_API_KEY_P8, APPLE_CERTIFICATE_BASE64, APPLE_PROVISIONING_PROFILE_BASE64) are not configured."
            echo "configured=false" >> $GITHUB_OUTPUT
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY || 'AIzaSyDemoKeyForCiBuildPurposesOnly12345' }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY || 'AIzaSyDemoKeyForCiBuildPurposesOnly12345' }}
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || secrets.CAPACITOR_SERVER_URL || '' }}

      - name: Sync Capacitor iOS
        run: npx cap sync ios
        env:
          CAPACITOR_SERVER_URL: ${{ github.event.inputs.server_url || secrets.CAPACITOR_SERVER_URL || '' }}

      - name: Install Apple Certificate
        if: steps.check_ios_secrets.outputs.configured == 'true'
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

      - name: Install Provisioning Profile
        if: steps.check_ios_secrets.outputs.configured == 'true'
        env:
          PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      - name: Create ExportOptions.plist
        if: steps.check_ios_secrets.outputs.configured == 'true'
        run: |
          cat <<EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>uploadSymbols</key>
            <true/>
            <key>destination</key>
            <string>export</string>
          </dict>
          </plist>
          EOF

      - name: Build & Archive Xcode Project
        if: steps.check_ios_secrets.outputs.configured == 'true'
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            archive

      - name: Export IPA
        if: steps.check_ios_secrets.outputs.configured == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/out

      - name: Upload to Apple TestFlight
        if: steps.check_ios_secrets.outputs.configured == 'true'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/out/App.ipa
          issuer-id: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          api-key-id: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          api-private-key: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}

      - name: Build Unsigned iOS Binaries (.ipa fallback)
        if: steps.check_ios_secrets.outputs.configured != 'true'
        run: |
          mkdir -p build/out/Payload
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -derivedDataPath DerivedData \
            clean build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
          cp -r DerivedData/Build/Products/*-iphoneos/App.app build/out/Payload/
          cd build/out && zip -r -y App-unsigned.ipa Payload && rm -rf Payload

      - name: Upload IPA as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trip-planner-ios-release-ipa
          path: build/out/*.ipa
          retention-days: 30

  # --------------------------------------------------------------------------
  # GitHub: Publish Release Assets (.apk, .aab, .ipa) to GitHub Releases
  # --------------------------------------------------------------------------
  publish-github-release:
    name: Publish to GitHub Releases
    needs: [release-android, release-ios]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') && (needs.release-android.result == 'success' || needs.release-ios.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create release assets directory
        run: mkdir -p release-assets dist

      - name: Download Android artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trip-planner-android-release
          path: release-assets/android

      - name: Download iOS artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: trip-planner-ios-release-ipa
          path: release-assets/ios

      - name: Prepare release files
        id: prepare_files
        run: |
          echo "Inspecting downloaded assets:"
          find release-assets -type f || true

          # Android APK: prefer signed APK if available, otherwise take unsigned/debug
          APK_FILE=$(find release-assets/android -name "*signed*.apk" 2>/dev/null | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find release-assets/android -name "*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -n "$APK_FILE" ]; then
            cp "$APK_FILE" dist/TripPlanner.apk
            echo "Staged APK: $APK_FILE -> dist/TripPlanner.apk"
          fi

          # Android AAB: prefer signed AAB if available, otherwise unsigned
          AAB_FILE=$(find release-assets/android -name "*signed*.aab" 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            AAB_FILE=$(find release-assets/android -name "*.aab" 2>/dev/null | head -n 1)
          fi
          if [ -n "$AAB_FILE" ]; then
            cp "$AAB_FILE" dist/TripPlanner.aab
            echo "Staged AAB: $AAB_FILE -> dist/TripPlanner.aab"
          fi

          # iOS IPA
          IPA_FILE=$(find release-assets/ios -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -n "$IPA_FILE" ]; then
            cp "$IPA_FILE" dist/TripPlanner.ipa
            echo "Staged IPA: $IPA_FILE -> dist/TripPlanner.ipa"
          fi

          echo "Staged release files in dist:"
          ls -la dist/

          FILE_COUNT=$(find dist -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::warning::No release binaries (.apk, .aab, .ipa) found to attach to release."
            echo "has_files=false" >> $GITHUB_OUTPUT
          else
            echo "has_files=true" >> $GITHUB_OUTPUT
          fi

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="release-$(date +'%Y%m%d-%H%M%S')"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Target Release Tag: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.prepare_files.outputs.has_files == 'true'
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "TripPlanner ${{ steps.get_tag.outputs.tag }}"
          files: dist/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
